version: 2
updates:
  # pip: this repo IS a Python package (pyproject.toml at the root).
  - package-ecosystem: "pip"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5
    labels:
      - "dependencies"
      - "pip"
    groups:
      pip-minor-and-patch:
        applies-to: version-updates
        update-types:
          - "minor"
          - "patch"
  # github-actions: keep the SHA-pinned actions current (SHA pinning stops
  # Dependabot alerts, so version updates are how the pins get refreshed).
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5
    labels:
      - "dependencies"
      - "github-actions"
    groups:
      github-actions-minor-and-patch:
        applies-to: version-updates
        update-types:
          - "minor"
          - "patch"
        patterns:
          - "*"
