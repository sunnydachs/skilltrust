name: CI

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

# contents: read only — the test job needs nothing else. Keeps a compromised
# dependency from pushing to the repo during a test run.
permissions:
  contents: read

# One run per ref at a time; a newer push cancels the stale run.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: test (${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12", "3.13", "3.14" ]
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      with:
        # CI needs no push credentials; drop the persisted auth header so a
        # later step cannot leak it.
        persist-credentials: false
    - name: Check the matrix versions are still supported
      run: python3 scripts/check_runtimes.py
    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7
      with:
        python-version: ${{ matrix.python-version }}
    - name: Install dependencies
      run: pip install -e ".[dev]"
    - name: Run tests
      run: python -m pytest tests/ -q
